<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battleship - Human vs AI</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>⚔️ Battleship</h1>
            <p class="subtitle">Human vs AI</p>
        </header>

        <div class="game-info">
            <div class="status" id="gameStatus">Place your ships to begin!</div>
            <div class="turn-indicator" id="turnIndicator"></div>
        </div>

        <div class="boards-container">
            <div class="board-section">
                <h2>Your Fleet</h2>
                <div class="board" id="playerBoard"></div>
                <div class="legend">
                    <span class="legend-item"><span class="cell ship"></span> Ship</span>
                    <span class="legend-item"><span class="cell hit"></span> Hit</span>
                    <span class="legend-item"><span class="cell miss"></span> Miss</span>
                </div>
            </div>

            <div class="board-section">
                <h2>Enemy Waters</h2>
                <div class="board" id="enemyBoard"></div>
                <div class="legend">
                    <span class="legend-item"><span class="cell hit"></span> Hit</span>
                    <span class="legend-item"><span class="cell miss"></span> Miss</span>
                </div>
            </div>
        </div>

        <div class="controls">
            <button id="startGame" class="btn btn-primary">Start Game</button>
            <button id="resetGame" class="btn btn-secondary">Reset</button>
        </div>

        <div class="ship-placement" id="shipPlacement">
            <h3>Place Your Ships</h3>
            <div class="ships-to-place" id="shipsToPlace"></div>
            <div class="placement-controls">
                <button id="rotateShip" class="btn btn-secondary">Rotate (R)</button>
                <button id="randomPlacement" class="btn btn-secondary">Random Placement</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
